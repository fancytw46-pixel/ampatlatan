name: Windows Latest AE Runner (Sunshine Confirmed Link)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Windows Performans ve Ag Optimizasyonu
      run: |
        $path = "HKCU:\Control Panel\Desktop"
        Set-ItemProperty -Path $path -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
        Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Windows Icin Tailscale Manuel Kurulumu
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
        Start-Sleep -Seconds 10
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

    - name: Sunshine Kurulumu (Senin Getirdiğin Güncel Link)
      run: |
        echo "Senin bulduğun güncel Sunshine sürümü indiriliyor..."
        # Tamamen senin verdiğin çalışan ve güncel link entegre edildi kanka
        Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/download/v2026.516.143833/Sunshine-Windows-AMD64-installer.exe" -OutFile "sunshine-setup.exe"
        
        echo "Sessiz kurulum başlatılıyor..."
        Start-Process -FilePath ".\sunshine-setup.exe" -ArgumentList "/S" -Wait
        Start-Sleep -Seconds 5
        
        echo "Sunshine kimlik bilgileri tanımlanıyor..."
        & "C:\Program Files\Sunshine\sunshine.exe" --creds aeuser AERunner2026

        echo "Sunshine servisi başlatılıyor..."
        Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -ArgumentList "--install-service" -Wait
        Start-Service -Name "Sunshine" -ErrorAction SilentlyContinue

    - name: Uzak Masaüstü Yedek Bağlantısı (RDP Güvenliği)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        
        if (-not (Get-LocalUser -Name "aeuser" -ErrorAction SilentlyContinue)) {
            $Password = ConvertTo-SecureString "AERunner2026" -AsPlainText -Force
            New-LocalUser -Name "aeuser" -Password $Password
            Add-LocalGroupMember -Group "Administrators" -Member "aeuser"
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "aeuser"
        }

    - name: Sistemi Acik Tut ve İzle
      run: |
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
        echo "===================================================="
        echo "🚀 SUNUCU SENİN LİNKİNLE SORUNSUZ HAZIRLANDI!"
        echo "🔗 TAILSCALE IP ADRESİNİZ: $ip"
        echo "===================================================="
        echo "Kullanıcı Adı: aeuser"
        echo "Şifre: AERunner2026"
        echo "===================================================="
        
        $timeout = New-TimeSpan -Hours 5 -Minutes 50
        $stopwatch = [Diagnostics.Stopwatch]::StartNew()
        while ($stopwatch.Elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
