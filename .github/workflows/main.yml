name: Windows Germany/Europe Location AE Runner (Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Fiziksel Lokasyonu Avrupa/Almanya Ayarla (Güvenli Yöntem)
      run: |
        echo "Saat dilimi Almanya (W. Europe Standard Time) olarak ayarlanıyor..."
        Set-TimeZone -Id "W. Europe Standard Time"
        
        echo "Bölgesel konum Registry üzerinden Almanya olarak yapılandırılıyor..."
        # GeoID 94 = Almanya. Hata riski olmayan Registry yöntemi
        Set-ItemProperty -Path "HKCU:\Control Panel\International\Geo" -Name "Nation" -Value "94" -Force

    - name: En İyi Görünüm Modu (Best Appearance)
      run: |
        echo "Görsel efektler en iyi görünüm moduna alınıyor..."
        $Path = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
        if (-not (Test-Path $Path)) { New-Item $Path -Force }
        Set-ItemProperty -Path $Path -Name "VisualFXSetting" -Value 1

    - name: Windows Performans ve Ag Optimizasyonu
      run: |
        $path = "HKCU:\Control Panel\Desktop"
        Set-ItemProperty -Path $path -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
        Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Windows Icin Tailscale Manuel Kurulumu
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
        Start-Sleep -Seconds 10
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

    - name: İstenmeyen Programları Kaldır (Unity & Re Silme)
      run: |
        echo "Gereksiz programlar temizleniyor..."
        Get-Package -Name "*Unity*" -ErrorAction SilentlyContinue | Uninstall-Package -Force -ErrorAction SilentlyContinue
        Get-Package -Name "*Re*" -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "Re" } | Uninstall-Package -Force -ErrorAction SilentlyContinue
        
        $Folders = @(
            "C:\Program Files\Unity", 
            "C:\Program Files\Unity Hub", 
            "C:\Program Files (x86)\Re",
            "C:\Program Files\Re"
        )
        foreach ($folder in $Folders) {
            if (Test-Path $folder) { Remove-Item -Path $folder -Recurse -Force -ErrorAction SilentlyContinue }
        }

    - name: Arka Plan Duvar Kağıdı Ayarlama
      run: |
        echo "Özel arka plan kuruluyor..."
        $bgUrl = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIx9OB-Hkmf8npVYB4M3rUHIu742wWDrAI3af25VxSMA&s=10"
        $bgPath = "C:\Windows\Web\Wallpaper\custom_wallpaper.jpg"
        Invoke-WebRequest -Uri $bgUrl -OutFile $bgPath
        Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value $bgPath
        rundll32.exe user32.dll, UpdatePerUserSystemParameters

    - name: Sunshine Kurulumu (Güncel Sürüm)
      run: |
        echo "Sunshine indiriliyor..."
        Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/download/v2026.516.143833/Sunshine-Windows-AMD64-installer.exe" -OutFile "sunshine-setup.exe"
        Start-Process -FilePath ".\sunshine-setup.exe" -ArgumentList "/S" -Wait
        Start-Sleep -Seconds 5
        & "C:\Program Files\Sunshine\sunshine.exe" --creds aeuser AERunner2026
        Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -ArgumentList "--install-service" -Wait
        Start-Service -Name "Sunshine" -ErrorAction SilentlyContinue

    - name: Uzak Masaüstü Yedek Bağlantısı (RDP Güvenliği)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        
        if (-not (Get-LocalUser -Name "aeuser" -ErrorAction SilentlyContinue)) {
            $Password = ConvertTo-SecureString "AERunner2026" -AsPlainText -Force
            New-LocalUser -Name "aeuser" -Password $Password
            Add-LocalGroupMember -Group "Administrators" -Member "aeuser"
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "aeuser"
        }

    - name: Sistemi Acik Tut ve İzle
      run: |
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
        echo "===================================================="
        echo "🚀 AVRUPA SUNUCUSU DÜŞÜK PİNG İLE HAZIR!"
        echo "🔗 TAILSCALE IP ADRESİNİZ: $ip"
        echo "===================================================="
        echo "Kullanıcı Adı: aeuser"
        echo "Şifre: AERunner2026"
        echo "===================================================="
        
        $timeout = New-TimeSpan -Hours 5 -Minutes 50
        $stopwatch = [Diagnostics.Stopwatch]::StartNew()
        while ($stopwatch.Elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
