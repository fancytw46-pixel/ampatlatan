name: Windows Latest AE Runner (Sunshine & Gamepad Ready)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Windows Performans ve Ag Optimizasyonu
      run: |
        $path = "HKCU:\Control Panel\Desktop"
        Set-ItemProperty -Path $path -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
        Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Windows Icin Tailscale Manuel Kurulumu
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
        Start-Sleep -Seconds 10
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

    - name: Sanal Ekran Sürücüsü Kurulumu
      run: |
        echo "Sanal ekran sürücüsü güvenli kaynaktan indiriliyor..."
        Invoke-WebRequest -Uri "https://github.com/itsmikethetech/Virtual-Display-Driver/releases/download/v23.12.2/VirtualDisplayDriver.zip" -OutFile "virtual-display.zip"
        Expand-Archive -Path "virtual-display.zip" -DestinationPath "C:\VirtualDisplay"
        cd C:\VirtualDisplay
        pnputil /add-driver *.inf /install
        echo "Sanal Monitör başarıyla aktif edildi."

    - name: Moonlight Gamepad Sürücüsü Kurulumu (ViGEmBus)
      run: |
        echo "ViGEmBus gamepad sürücüsü indiriliyor..."
        # Moonlight için gerekli olan resmi sanal kol emülatör sürücüsü
        Invoke-WebRequest -Uri "https://github.com/ViGEm/ViGEmBus/releases/download/v1.22.0/ViGEmBusSetup_x64.msi" -OutFile "ViGEmBusSetup.msi"
        
        echo "Sürücü arka planda sessizce kuruluyor..."
        # /qn parametresi ile kullanıcıya hiçbir şey sormadan arka planda kurduruyoruz
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "ViGEmBusSetup.msi", "/qn", "/norestart" -Wait
        echo "Gamepad sürücüsü başarıyla yüklendi!"

    - name: Sunshine Kurulumu ve Otomatik Kimlik Tanımlama
      run: |
        echo "Sunshine indiriliyor..."
        Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/download/v2025.1.0/sunshine-windows-x64-installer.exe" -OutFile "sunshine-setup.exe"
        Start-Process -FilePath ".\sunshine-setup.exe" -ArgumentList "/S" -Wait
        Start-Sleep -Seconds 5
        
        echo "Sunshine kimlik bilgileri arka planda ayarlanıyor..."
        & "C:\Program Files\Sunshine\sunshine.exe" --creds aeuser AERunner2026!
        
        echo "Sunshine servisi başlatılıyor..."
        Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -ArgumentList "--install-service" -Wait
        Start-Service -Name "Sunshine" -ErrorAction SilentlyContinue

    - name: Uzak Masaüstü Yedek Bağlantısı (RDP Güvenliği)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        
        $Password = ConvertTo-SecureString "AERunner2026!" -AsPlainText -Force
        New-LocalUser -Name "aeuser" -Password $Password -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "aeuser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "aeuser" -ErrorAction SilentlyContinue

    - name: Sistemi Acik Tut ve PIN Girişini Bekle
      run: |
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
        echo "===================================================="
        echo "🚀 SUNUCU GAMEPAD DESTEĞİYLE BİRLİKTE HAZIR!"
        echo "🔗 TAILSCALE IP ADRESİNİZ: $ip"
        echo "===================================================="
        echo "Kullanıcı Adı: aeuser"
        echo "Şifre: AERunner2026!"
        echo "===================================================="
        
        $timeout = New-TimeSpan -Hours 5 -Minutes 50
        $stopwatch = [Diagnostics.Stopwatch]::StartNew()
        while ($stopwatch.Elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
